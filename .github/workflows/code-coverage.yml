name: Code Coverage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore SubscriptionService.sln

      - name: Build code
        run: dotnet build SubscriptionService.sln --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: >-
          dotnet test
          tests/SubscriptionService.Tests/SubscriptionService.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=SubscriptionService.Tests.trx"
          --results-directory "${{ github.workspace }}/coverage/unit-tests"

      - name: Merge coverage reports
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: coverage/**/*.cobertura.xml
          targetdir: coverage-report
          reporttypes: Cobertura

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage-report/Cobertura.xml

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            coverage/**/*.cobertura.xml
            coverage-report/Cobertura.xml
          if-no-files-found: warn
          retention-days: 30
