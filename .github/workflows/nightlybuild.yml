name: Nightly Build

on:
  schedule:
  - cron: "45 23 * * *"
  repository_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: "Nightly Build"
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore SubscriptionService.sln

      - name: Build code
        run: dotnet build SubscriptionService.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test tests/SubscriptionService.Tests/SubscriptionService.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=SubscriptionService.Tests.trx"
          --results-directory "${{ github.workspace }}/TestResults"

      - uses: actions/upload-artifact@v4
        with:
        name: tracelogs
        path: /home/runner/trace/   

      - name: Notify on nightly failure
        if: ${{ failure() }}
        uses: TransactionProcessing/org-ci-workflows/.github/actions/nightly-failure-issue@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          title: Investigate Nightly Build Failure
          labels: nightlybuild
          dedupe_key: nightlybuild
          body: |
            Repo: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}
