name: Build Docker and Deploy Development

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore SubscriptionService.sln --runtime win-x64

      - name: Build code
        run: dotnet build SubscriptionService.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test
          tests/SubscriptionService.Tests/SubscriptionService.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=SubscriptionService.Tests.trx"
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Build Docker image
        run: >-
          docker build
          --file src/SubscriptionService.Worker/Dockerfile
          --tag subscriptionservice:master
          .

      - name: Publish Windows service
        run: >-
          dotnet publish
          src/SubscriptionService.Worker/SubscriptionService.Worker.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publishOutput
          --no-restore

      - name: Build deployment package
        run: zip -r subscriptionservice.zip publishOutput

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: subscriptionservice
          path: subscriptionservice.zip
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30

  deploy-development:
    name: Deploy to Development
    runs-on: developmentserver
    needs: build
    environment: development

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: subscriptionservice

      - name: Stop and remove existing Windows service
        shell: powershell
        run: |
          $serviceName = "Transaction Processing - Subscription Service"
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Stop-Service -Name $serviceName -Force
            sc.exe delete $serviceName
          }

      - name: Unzip deployment package
        shell: powershell
        run: |
          $deploymentPath = "C:\txnproc\transactionprocessing\subscriptionservice"
          New-Item -ItemType Directory -Path $deploymentPath -Force | Out-Null
          Expand-Archive -Path subscriptionservice.zip -DestinationPath $deploymentPath -Force

      - name: Install and start Windows service
        shell: powershell
        run: |
          $serviceName = "Transaction Processing - Subscription Service"
          $servicePath = "C:\txnproc\transactionprocessing\subscriptionservice\publishOutput\SubscriptionService.Worker.exe"
          [Environment]::SetEnvironmentVariable("ASPNETCORE_ENVIRONMENT", "Development", "Machine")
          New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          Start-Service -Name $serviceName
