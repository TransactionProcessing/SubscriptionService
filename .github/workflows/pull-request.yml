name: Build and Test Pull Requests

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test Pull Requests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore SubscriptionService.sln

      - name: Build code
        run: dotnet build SubscriptionService.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test
          tests/SubscriptionService.Tests/SubscriptionService.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=SubscriptionService.Tests.trx"
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30
