name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Restore NuGet packages
        run: dotnet restore SubscriptionService.sln --runtime win-x64

      - name: Build code
        run: dotnet build SubscriptionService.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test
          tests/SubscriptionService.Tests/SubscriptionService.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=SubscriptionService.Tests.trx"
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: >-
          docker build
          --file src/SubscriptionService.Worker/Dockerfile
          --tag stuartferguson/subscriptionservice:${{ github.event.release.prerelease && 'dev' || 'latest' }}
          .

      - name: Push Docker image
        run: >-
          docker push
          stuartferguson/subscriptionservice:${{ github.event.release.prerelease && 'dev' || 'latest' }}

      - name: Publish Windows service
        run: >-
          dotnet publish
          src/SubscriptionService.Worker/SubscriptionService.Worker.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publishOutput
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Build release package
        run: zip -r subscriptionservice.zip publishOutput

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: subscriptionservice
          path: subscriptionservice.zip
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 90

  deploy-staging:
    name: Deploy to Staging
    runs-on: stagingserver
    needs: build
    environment: staging

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: subscriptionservice

      - name: Stop and remove existing Windows service
        shell: powershell
        run: |
          $serviceName = "Transaction Processing - Subscription Service"
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Stop-Service -Name $serviceName -Force
            sc.exe delete $serviceName
          }

      - name: Unzip release package
        shell: powershell
        run: |
          $deploymentPath = "C:\txnproc\transactionprocessing\subscriptionservice"
          New-Item -ItemType Directory -Path $deploymentPath -Force | Out-Null
          Expand-Archive -Path subscriptionservice.zip -DestinationPath $deploymentPath -Force

      - name: Install and start Windows service
        shell: powershell
        run: |
          $serviceName = "Transaction Processing - Subscription Service"
          $servicePath = "C:\txnproc\transactionprocessing\subscriptionservice\publishOutput\SubscriptionService.Worker.exe"
          [Environment]::SetEnvironmentVariable("ASPNETCORE_ENVIRONMENT", "Staging", "Machine")
          New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          Start-Service -Name $serviceName

  deploy-production:
    name: Deploy to Production
    runs-on: productionserver
    needs: [build, deploy-staging]
    if: ${{ github.event.release.prerelease == false }}
    environment: production

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: subscriptionservice

      - name: Stop and remove existing Windows service
        shell: powershell
        run: |
          $serviceName = "Transaction Processing - Subscription Service"
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Stop-Service -Name $serviceName -Force
            sc.exe delete $serviceName
          }

      - name: Unzip release package
        shell: powershell
        run: |
          $deploymentPath = "C:\txnproc\transactionprocessing\subscriptionservice"
          New-Item -ItemType Directory -Path $deploymentPath -Force | Out-Null
          Expand-Archive -Path subscriptionservice.zip -DestinationPath $deploymentPath -Force

      - name: Install and start Windows service
        shell: powershell
        run: |
          $serviceName = "Transaction Processing - Subscription Service"
          $servicePath = "C:\txnproc\transactionprocessing\subscriptionservice\publishOutput\SubscriptionService.Worker.exe"
          [Environment]::SetEnvironmentVariable("ASPNETCORE_ENVIRONMENT", "Production", "Machine")
          New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          Start-Service -Name $serviceName
